<!-- PBL6/app/templates/user/generate_music/generate_music.html -->

{% extends 'user/layout.html' %}

{#{% block title %}Tạo âm nhạc theo phong cách riêng bạn{% endblock %}#}

{% block content %}
    <style>
        .chat-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #fff;
        }
        .chat-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .chat-messages {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #eee;
            padding: 10px;
            margin-bottom: 20px;
            background-color: #f9f9f9;
        }
        .chat-input {
            display: flex;
        }
        .chat-input input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px 0 0 4px;
        }
        .chat-input button {
            padding: 10px 20px;
            border: 1px solid #ddd;
            border-left: none;
            background-color: #007bff;
            color: #fff;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
        }
        .chat-input button:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
        .spinner-border {
            width: 1.5rem;
            height: 1.5rem;
        }
    </style>
    <div class="chat-container">
        <div class="col-md-3 sidebar">
            {% include 'components/user/sidebar.html' %}
        </div>
        <div class="chat-header">
            <h3>Tạo âm nhạc theo phong cách riêng bạn</h3>
        </div>
        <div class="chat-messages" id="chat-messages">
            <!-- Tin nhắn sẽ được thêm vào đây -->
        </div>
        <div class="chat-input">
            <input type="text" id="music-request" class="form-control" placeholder="Nhập yêu cầu bài hát của bạn...">
            <button id="send-button" class="btn btn-primary">Gửi</button>
        </div>
        <div class="mt-3" id="status-message" style="display: none;">
            <div class="d-flex align-items-center">
                <div class="spinner-border text-primary me-2" role="status">
                    <span class="visually-hidden">Đang tạo...</span>
                </div>
                <span>Đang tạo âm nhạc...</span>
            </div>
        </div>
        <div class="mt-3" id="download-section" style="display: none;">
            <h5>Âm nhạc đã được tạo thành công!</h5>
            <audio controls>
                <source id="audio-source" src="" type="audio/wav">
                Trình duyệt của bạn không hỗ trợ thẻ audio.
            </audio>
            <a id="download-link" href="#" download="custom_music.wav" class="btn btn-success mt-2">Tải xuống</a>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            $('#send-button').click(function() {
                const text = $('#music-request').val().trim();
                if (text === "") {
                    alert("Vui lòng nhập yêu cầu bài hát của bạn!");
                    return;
                }

                // Hiển thị tin nhắn của người dùng
                $('#chat-messages').append(`<div class="mb-2"><strong>Bạn:</strong> ${text}</div>`);
                $('#music-request').val("");

                // Hiển thị trạng thái đang tạo âm nhạc
                $('#status-message').show();
                $('#download-section').hide();

                // Gửi yêu cầu đến server
                $.ajax({
                    url: "{{ url_for('user.generate_music.generate_music') }}",
                    type: "POST",
                    contentType: "application/json",
                    data: JSON.stringify({ text: text }),
                    xhrFields: {
                        responseType: 'blob'
                    },
                    success: function(data, status, xhr) {
                        // Tạo URL cho tệp tin âm thanh
                        const url = window.URL.createObjectURL(data);
                        const a = document.createElement('a');
                        a.href = url;
                        const disposition = xhr.getResponseHeader('Content-Disposition');
                        let filename = "custom_music.wav";
                        if (disposition && disposition.indexOf('attachment') !== -1) {
                            const filenameRegex = /filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/;
                            const matches = filenameRegex.exec(disposition);
                            if (matches != null && matches[1]) {
                                filename = matches[1].replace(/['"]/g, '');
                            }
                        }
                        a.download = filename;
                        a.style.display = 'none';
                        document.body.appendChild(a);
                        a.click();
                        window.URL.revokeObjectURL(url);

                        // Cập nhật giao diện
                        $('#status-message').hide();
                        $('#download-section').show();
                        $('#audio-source').attr('src', url);
                        $('#download-link').attr('href', url).attr('download', filename);
                    },
                    error: function(xhr, status, error) {
                        $('#status-message').hide();
                        alert("Đã xảy ra lỗi khi tạo âm nhạc: " + (xhr.responseJSON ? xhr.responseJSON.error : error));
                    }
                });
            });

            // Gửi yêu cầu khi nhấn Enter
            $('#music-request').keypress(function(e) {
                if (e.which === 13) { // Enter key pressed
                    $('#send-button').click();
                }
            });
        });
    </script>
{% endblock %}
